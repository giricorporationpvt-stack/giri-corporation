    <!-- Capital 'G' Arc -->
    <path d=M 305 188 
 A 120 120 0 1 0 295 305 fill=none />
    <path d=M 248 212 L 320 212 fill=none />
    
    <!-- Infinity loop intertwined across lower portion -->
