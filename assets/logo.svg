 C 210 198, 155 206, 155 250 
 C 155 294, 210 302, 250 250 
 C 290 198, 345 206, 345 250 
 C 345 294, 290 302, 250 250 Z fill=none />
  </g>
  <!-- Wordmark -->
  <text x=250 y=385 text-anchor=middle font-family=-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif font-size=21 font-weight=500 letter-spacing=0.45em fill=#111215>GIRI</text>
</svg>
